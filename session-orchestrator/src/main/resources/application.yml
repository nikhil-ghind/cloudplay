server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: session-orchestrator
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # The orchestrator uses WebClient (WebFlux) but serves a blocking MVC API; run
  # the embedded servlet container, not Netty.
  main:
    web-application-type: servlet

cloudplay:
  orchestrator:
    signaling-base-url: ${SIGNALING_BASE_URL:wss://signaling.cloudplay.example.com}
    max-allocation-attempts: 5
    registry:
      base-url: ${REGISTRY_URL:http://registry-service:8083}
      connect-timeout: 2s
      response-timeout: 5s
    autoscaler:
      enabled: true
      evaluation-interval: 15s
      evaluation-interval-millis: 15000
      target-utilization: 0.70
      warm-slot-buffer: 2
      min-nodes: 1
      max-nodes: 50
      slots-per-node: 4
      max-scale-down-step: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.cloudplay: INFO
