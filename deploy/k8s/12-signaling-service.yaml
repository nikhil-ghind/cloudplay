apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling-service
  namespace: cloudplay
  labels:
    app: signaling-service
    app.kubernetes.io/part-of: cloudplay
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signaling-service
  template:
    metadata:
      labels:
        app: signaling-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: signaling-service
          image: ghcr.io/cloudplay/signaling-service:1.0.0
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: cloudplay-config
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: signaling-service
  namespace: cloudplay
  labels:
    app: signaling-service
  annotations:
    # Sticky routing keeps both peers of a session on the same pod (local map).
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: signaling-service
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: signaling-service-hpa
  namespace: cloudplay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: signaling-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # Scale on active signaling sessions exported by the app (Prometheus Adapter).
    - type: Pods
      pods:
        metric:
          name: cloudplay_signaling_active_sessions
        target:
          type: AverageValue
          averageValue: "150"
