apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudplay-config
  namespace: cloudplay
  labels:
    app.kubernetes.io/part-of: cloudplay
data:
  # Service-to-service URLs (cluster DNS)
  REGISTRY_URL: "http://registry-service:8083"
  ORCHESTRATOR_URL: "http://session-orchestrator:8082"
  SIGNALING_URL: "wss://signaling.cloudplay.example.com"
  SIGNALING_BASE_URL: "wss://signaling.cloudplay.example.com"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  AUTH_ENABLED: "true"
  SIGNALING_ALLOWED_ORIGINS: "https://play.cloudplay.example.com"
  SPRING_PROFILES_ACTIVE: "redis"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudplay-secrets
  namespace: cloudplay
  labels:
    app.kubernetes.io/part-of: cloudplay
type: Opaque
stringData:
  # NOTE: placeholder only. In production, source from an external secret manager
  # (e.g. AWS Secrets Manager via External Secrets Operator). Never commit real keys.
  API_KEYS: "replace-me-key-1,replace-me-key-2"
